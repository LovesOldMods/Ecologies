modLoader = "javafml"
loaderVersion = "[1,)"
license = "${license}"
issueTrackerURL = ""

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "${authors}"
credits = "All the designs, textures and models are by Klei Wright (Matcha Flavoured), used under CC BY-NC-SA 4.0."
description = '''
Makes the world feel a bit more alive. Lichen eats away at stone, muskox graze on it, bat colonies
come out at night to feed over your crops, and predators hunt when they're hungry instead of wiping
everything out.
'''

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "terrablender"
type = "required"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "ecologies.mixins.json"
